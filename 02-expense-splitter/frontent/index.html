<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrabTab — shared household tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#shopping" aria-label="GrabTab home"><span class="brand-mark">G</span><span>GrabTab</span></a>
        <p class="household"><span class="status-dot"></span> Elm Street Home</p>
        <nav id="nav" aria-label="Primary navigation">
          <button class="nav-link active" data-view="shopping"><span>☷</span> Shopping list <b id="shopping-count">0</b></button>
          <button class="nav-link" data-view="expenses"><span>▤</span> Expenses</button>
          <button class="nav-link" data-view="balances"><span>◒</span> Balances</button>
          <button class="nav-link" data-view="household"><span>♙</span> Household</button>
        </nav>
        <div class="sidebar-foot">
          <div class="user-chip"><span class="avatar avatar-anna">A</span><span><strong>Anna</strong><small>Signed in</small></span><span class="chevron">⌄</span></div>
          <button id="reset-demo" class="quiet-button">↻ Reset demo data</button>
        </div>
      </aside>
      <main id="app" class="content" aria-live="polite"></main>
    </div>
    <div id="modal-root"></div>
    <div id="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
