{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Shared Household Chores{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'household/site.css' %}">
  </head>
  <body>
    <header class="site-header">
      <div class="page-width header-content">
        <a class="brand" href="{% url 'household:home' %}">Shared Household</a>
        <nav aria-label="Primary navigation">
          <a href="{% url 'household:home' %}"{% if request.resolver_match.url_name != "neighborhood" %} aria-current="page"{% endif %}>Household</a>
          <a href="{% url 'household:neighborhood' %}"{% if request.resolver_match.url_name == "neighborhood" %} aria-current="page"{% endif %}>Neighborhood</a>
        </nav>
      </div>
    </header>
    <main class="page-width">
      {% if messages %}
        <section class="messages" aria-label="Notifications">
          {% for message in messages %}
            <p class="message{% if message.tags %} message--{{ message.tags }}{% endif %}"{% if 'error' in message.tags %} role="alert"{% else %} role="status"{% endif %}>{{ message }}</p>
          {% endfor %}
        </section>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
